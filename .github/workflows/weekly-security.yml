name: Weekly security

# Two checks that no push-triggered gate can make, because nothing here
# changes when the world does:
#
#   - the Node runtime inside the pinned base images (docker/Dockerfile).
#     Node is a tarball in the official image, so `apk upgrade` and Trivy
#     never see a Node security release; only a new base digest moves it.
#     scripts/check-node-version.mjs reads NODE_VERSION from the image
#     configuration behind each pinned digest and fails when it is behind
#     the newest release of its major in nodejs.org's index.
#   - `pnpm audit --prod` against the lockfile, at any severity, so an
#     advisory published between merges is seen within a week.
#
# A failing run is the alert (the repository's failed-workflow notification
# reaches whoever watches it); nothing is opened or changed automatically.
# Run it by hand from the Actions tab with "Run workflow".
#
# Not here, on purpose: a full rebuild and Trivy scan of the nine images is
# heavy, and the push-time `docker` job already does it on every merge.

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-version:
    name: pinned Node is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Script tests
        run: node --test scripts/check-node-version.test.mjs

      - name: Pinned base images against the latest Node release
        run: node scripts/check-node-version.mjs docker/Dockerfile

  audit:
    name: production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Audit production dependencies
        run: pnpm audit --prod
