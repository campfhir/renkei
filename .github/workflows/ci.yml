name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository. A job that needs more (CodeQL
# uploads its findings) asks for exactly that on the job.
#
# Every action is pinned to a full commit SHA, with the release it was
# resolved from in the trailing comment: a tag can be moved to other code,
# a commit cannot. Dependabot (.github/dependabot.yml, github-actions)
# bumps SHA and comment together.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The sandbox worker's file search and grep spawn ripgrep, as the
      # sandbox image (docker/Dockerfile) installs it; its tests run the
      # real binary against a real checkout, and the runner has none.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      - name: Lint
        run: pnpm lint
        env:
          # Whole-monorepo type-aware linting (parserOptions.project in
          # eslint.config.js) builds one TS program across every workspace
          # package. That now outgrows Node's default old-space ceiling
          # (~4GB) and OOM-kills the runner; raise it well under the
          # runner's 16GB before that ceiling gets hit again.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # The data store against a real, migrated Postgres. `pnpm test` above
  # holds the memory store to itself (every repository method has a
  # differential scenario, answered deterministically); this job runs each
  # scenario against a freshly truncated contract database AND the memory
  # store (seeded with the same rows, as Postgres stored them) and requires
  # equal answers, and runs the older contract cases. Scenarios use values
  # that sort alike under the database's collation and the memory store's
  # plain string compare.
  db-contract:
    name: data store (postgres vs memory)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: renkei
          POSTGRES_PASSWORD: renkei
          POSTGRES_DB: renkei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renkei -d renkei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://renkei:renkei@localhost:5432/renkei
      CONTRACT_DATABASE_URL: postgres://renkei:renkei@localhost:5432/renkei_contract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the contract database
        run: >-
          psql "$DATABASE_URL" -c "CREATE DATABASE renkei_contract TEMPLATE template0
          LOCALE_PROVIDER icu ICU_LOCALE 'en-US' LOCALE 'C.UTF-8'"

      - name: Migrate
        run: |
          pnpm --filter @renkei/db migrate
          DATABASE_URL="$CONTRACT_DATABASE_URL" pnpm --filter @renkei/db migrate

      - name: Differential and contract
        run: pnpm --filter @renkei/db test:contract

  # The browser suite (apps/web/playwright.config.ts): a production build of
  # the web app on the in-memory data store (RENKEI_DATA_STORE=memory, no
  # Postgres), its delegate and workers in-process, beside the sandbox, MCP and
  # model stubs. Built once here with the suite's environment
  # (apps/web/e2e/server-env.ts), then run in three shards that each start
  # that build (E2E_PREBUILT) instead of building again.
  e2e-build:
    name: e2e build (memory store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web app for the suite
        run: pnpm --filter renkei e2e:build

      # A tarball, so the links .next/node_modules holds into the pnpm store
      # survive the trip; each shard installs the same lockfile they point at.
      - name: Pack the build
        run: tar -cf web-build.tar -C apps/web --exclude=.next/cache .next

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-web-build
          path: web-build.tar
          if-no-files-found: error
          retention-days: 1

  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/3 (memory store)
    needs: e2e-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full Chromium build only: the suite runs it in headless mode
      # (channel 'chromium', playwright.config.ts), never the headless shell.
      - name: Install Chromium
        run: pnpm --filter renkei exec playwright install --with-deps --no-shell chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-web-build

      - name: Unpack the build
        run: tar -xf web-build.tar -C apps/web

      - name: Browser suite (shard ${{ matrix.shard }} of 3)
        env:
          E2E_PREBUILT: '1'
          SHARD: ${{ matrix.shard }}/3
        run: pnpm --filter renkei exec playwright test --shard="$SHARD"

      # A failed shard's traces and screenshots (retain-on-failure in
      # playwright.config.ts) and its HTML report, to open with
      # `npx playwright show-trace` / `show-report`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-results-shard-${{ matrix.shard }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # The one check to require: every shard passed (a skipped or cancelled
  # shard, or a failed build, fails it).
  e2e-memory:
    name: e2e (memory store)
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.e2e-shard.result }}
        run: test "$RESULT" = success

  # Every change to the product (apps/, packages/, docker/) needs an entry in
  # apps/web/lib/changelog.ts in the same pull request, or a commit that says
  # `Changelog: none`. `pnpm changelog add` writes the entry with today's date.
  # The check also fails a malformed changelog, such as a null date.
  changelog:
    name: changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check diffs the pull request's base against its head, so it
          # needs their history, not the shallow clone the other jobs use.
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Changelog helper tests
        run: node --test scripts/changelog.test.mjs

      - name: Changelog check
        run: >-
          node scripts/changelog.mjs check
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}

  # The dependency audit: a high or critical advisory against a PRODUCTION
  # dependency fails the build. The advisories that were already open when
  # this gate went in are listed, each with a review date, under
  # auditConfig.ignoreGhsas in pnpm-workspace.yaml — so what fails here is
  # a NEW one, or an old one someone has let go past its date without
  # fixing or renewing it. `pnpm audit` reads the lockfile; no install.
  security:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  # Static analysis of the TypeScript (CodeQL's default query suite plus
  # security-extended). The workspace packages ship source and the apps
  # are transpiled at build time, so no build step is needed for the
  # extraction. Results land under Security → Code scanning.
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript

  # What a pull request ADDS to the dependency graph: a new dependency with
  # a known high/critical advisory, or a license the repository does not
  # ship, fails the check before the lockfile change is merged.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The action needs the repository's Dependency graph (Settings →
      # Security analysis), which is not on yet; until it is, the step
      # reports but does not fail the job. Delete the continue-on-error
      # line once the graph is enabled so the review gates merges as
      # intended.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0

  # Publishes every image docker-compose.yaml pulls, but only once the checks
  # above have passed on a push to main — never for a pull request. Each
  # image is tagged three times: `latest`, the version in apps/web/package.json
  # (the same version scripts/docker-build.sh stamps — every app in the
  # workspace shares it), and the commit SHA, so a deployment can pin the
  # exact build it tested. One matrix entry per target, so nine Dockerfile
  # stages build in parallel and no single runner has to hold all of them.
  #
  # Each image is built twice: first loaded into the runner's Docker and
  # scanned by Trivy — a fixable HIGH or CRITICAL in the OS packages or in
  # node_modules fails the job and nothing is pushed (.trivyignore carries
  # the dated baseline, see pnpm-workspace.yaml's audit list) — then, from
  # the same layer cache, pushed with a SLSA provenance attestation and an
  # SBOM attached to the manifest. Two builds because attestations cannot be
  # loaded into a local Docker, only pushed.
  #
  # Secrets (repository → Settings → Secrets and variables → Actions):
  #   DOCKERHUB_USERNAME  the Docker Hub account to log in as
  #   DOCKERHUB_TOKEN     a Docker Hub access token with read/write scope
  # Optional variable:
  #   DOCKERHUB_NAMESPACE the namespace images are pushed under; defaults
  #                       to DOCKERHUB_USERNAME (an org namespace differs).
  # Every image is built, smoke-started and scanned on every pull request,
  # so an image that cannot boot or a dependency or base-image advisory
  # fails the PR that would ship it rather than the push to main that
  # publishes it; the publish itself (login and push) happens only on main.
  docker:
    name: docker (${{ matrix.image }})
    needs: [checks, security]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # The smoke start boots the image against a database at this build's
    # schema. pgvector, because the migrations create the extension; the
    # same image and digest docker-compose.yaml runs.
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: renkei
          POSTGRES_PASSWORD: renkei
          POSTGRES_DB: renkei
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renkei -d renkei"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Serialize pushes of the same image so a fast build from an older
    # commit can never overwrite `latest` after a newer one already has. A
    # pull request's scan builds are their own group, per branch, and never
    # wait behind a publish.
    concurrency:
      group: docker-${{ github.event_name == 'push' && 'publish' || github.head_ref }}-${{ matrix.image }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            image: renkei
          - target: migrate
            image: renkei-migrate
          - target: worker
            image: renkei-worker
          - target: fileshares
            image: renkei-fileshares
          - target: onbase
            image: renkei-onbase
          - target: mirth
            image: renkei-mirth
          - target: admanager
            image: renkei-admanager
          - target: delegate
            image: renkei-delegate
          - target: sandbox
            image: renkei-sandbox
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image name and version
        id: meta
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
          PUBLISH: ${{ github.event_name == 'push' }}
        run: |
          if [[ "$PUBLISH" == "true" && -z "$NAMESPACE" ]]; then
            echo "::error::Set the DOCKERHUB_USERNAME secret (and DOCKERHUB_TOKEN) to publish images." >&2
            exit 1
          fi
          version="$(node -p "require('./apps/web/package.json').version")"
          repo="${NAMESPACE:-renkei-ci}/${{ matrix.image }}"
          {
            echo "version=${version}"
            echo "tags=${repo}:${version},${repo}:latest,${repo}:${GITHUB_SHA}"
            echo "scan_tag=${repo}:scan-${GITHUB_SHA}"
            echo "commit=$(git rev-parse --short HEAD)"
            # The upgrade layers' cache key (docker/Dockerfile, DISTRO_REFRESH):
            # one value per UTC day, so a distribution fix reaches the image
            # within a day instead of waiting on an unrelated Dockerfile edit.
            echo "distro_refresh=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" == "true" ]]; then
            echo "Publishing ${repo}:${version}, ${repo}:latest and ${repo}:${GITHUB_SHA}"
          else
            echo "Scanning ${repo}:scan-${GITHUB_SHA} (not published: ${GITHUB_EVENT_NAME})"
          fi

      # The docker-container driver is what lets the Dockerfile's
      # `# syntax=docker/dockerfile:1-labs` frontend and the GitHub Actions
      # layer cache below work.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.scan_tag }}
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            DISTRO_REFRESH=${{ steps.meta.outputs.distro_refresh }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max

      # The schema for the smoke start, applied from the checkout: the
      # migrate image is validated by its own job (the script runs it to a
      # clean exit), and building it here too would rebuild the builder
      # stage in every job whenever a source file changed.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.target != 'migrate'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.target != 'migrate'
        with:
          node-version: 24
          cache: pnpm

      - name: Migrate the smoke database
        if: matrix.target != 'migrate'
        env:
          DATABASE_URL: postgres://renkei:renkei@127.0.0.1:5432/renkei
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @renkei/db migrate

      # Does the image boot? Started the way compose would start it, with
      # invented keys, until its health endpoint answers (the web app's
      # only once the schema is this build's), or the queue worker's boot
      # line appears, or the migrate image exits cleanly. An image that
      # cannot start fails here, before anything is published.
      - name: Smoke start
        env:
          SMOKE_DATABASE_URL: postgres://renkei:renkei@127.0.0.1:5432/renkei
        run: scripts/smoke-image.sh "${{ matrix.target }}" "${{ steps.meta.outputs.scan_tag }}"

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.scan_tag }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore

      - name: Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_COMMIT=${{ steps.meta.outputs.commit }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            DISTRO_REFRESH=${{ steps.meta.outputs.distro_refresh }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.target }}
