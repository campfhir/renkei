# docker-compose.yaml — for a target/production machine.
#
# Pulls the pre-built images pushed via scripts/docker-push.sh instead of
# building from source: this file and a `.env` next to it are all a target
# machine needs, no repository checkout required.
#
#   docker compose -f docker-compose.yaml up -d postgres
#   docker compose -f docker-compose.yaml run --rm migrate
#   docker compose -f docker-compose.yaml up -d renkei
#
# PUBLIC_BASE_URL in .env must match whatever address actually reaches this
# host on port 80. That same URL must be registered as the Atlassian app's
# callback — the gateway refuses to start if they disagree.
#
# Port 80 is exposed directly here as the requested default. That means
# bearer tokens travel in plaintext to anyone who can reach this host on 80 —
# fine on a private/internal network, not fine on the open internet. For a
# public deployment, put a TLS-terminating reverse proxy in front instead and
# publish 3000 on 127.0.0.1 only.

x-database-urls: &database-urls
  DATABASE_URL: postgres://renkei:renkei@postgres:5432/renkei

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: renkei-postgres
    environment:
      POSTGRES_USER: renkei
      POSTGRES_PASSWORD: renkei
      POSTGRES_DB: renkei
    volumes:
      - renkei-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U renkei -d renkei']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: scotteremiaroden/renkei-migrate:latest
    container_name: renkei-migrate
    env_file:
      - .env
    environment: *database-urls
    depends_on:
      postgres:
        condition: service_healthy
    # Kept out of `docker compose up` so starting the gateway never re-runs
    # migrations as a side effect. Run manually with:
    # docker compose -f docker-compose.yaml run --rm migrate
    profiles: ['tools']

  worker:
    image: scotteremiaroden/renkei-worker:latest
    container_name: renkei-worker
    env_file:
      - .env
    environment: *database-urls
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  renkei:
    image: scotteremiaroden/renkei:latest
    container_name: renkei-app
    env_file:
      - .env
    environment:
      <<: *database-urls
      # PUBLIC_BASE_URL in .env is the authoritative origin when set — it is
      # the address registered with every OAuth provider. Without it, the app
      # falls back to X-Forwarded-Proto/Host from the reverse proxy, which it
      # believes unconditionally — so this port must never be reachable by
      # untrusted clients directly: keep it published on 127.0.0.1 / an
      # internal network, with the proxy in front.
    ports:
      - '80:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  renkei-postgres:
