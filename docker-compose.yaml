# docker-compose.yaml — for a target/production machine.
#
# Pulls the pre-built images instead of building from source: this file and
# a `.env` next to it are all a target machine needs, no repository checkout
# required. CI publishes every image below to Docker Hub on each push to
# main that passes its checks (the `docker` job in .github/workflows/ci.yml,
# tags `latest` and the apps/web/package.json version); scripts/docker-push.sh
# pushes the same images from a checkout.
#
#   docker compose -f docker-compose.yaml up -d postgres
#   docker compose -f docker-compose.yaml run --rm migrate
#   docker compose -f docker-compose.yaml up -d renkei
#
# PUBLIC_BASE_URL in .env is required: the https address people reach this
# host at through your TLS-terminating reverse proxy. That same URL is
# registered with the identity provider and every connector, and the app
# refuses to start without it.
#
# The app is published on 127.0.0.1:3000 only. Point the reverse proxy at it;
# do not publish it to other machines, where bearer tokens would cross the
# network in the clear.

# The database credential comes from .env, never from this file:
#   POSTGRES_PASSWORD   required — `openssl rand -hex 32` (hex, so it needs
#                       no URL-escaping inside DATABASE_URL below)
#   POSTGRES_USER       optional, default renkei
#   POSTGRES_DB         optional, default renkei
#   DATABASE_URL_PARAMS optional query string appended to DATABASE_URL. The
#                       bundled postgres is reached over the private compose
#                       network only, with no TLS, so leave it empty here;
#                       a deployment pointing at a managed Postgres instead
#                       sets `?sslmode=verify-full` (and, if the server's
#                       certificate chain is private, `&sslrootcert=...`)
#                       and drops the postgres service.
# `docker compose config` and `up` refuse to start while POSTGRES_PASSWORD is
# unset, which is the point: there is no default to forget to change.
#
# Database roles (audit R-13; DEPLOYMENT.md, "Database roles"). Out of the box
# there is ONE role, POSTGRES_USER: it owns every table and every service
# connects as it, exactly as before. An owner can disable the append-only
# triggers on the audit trails, so a deployment that wants those trails
# tamper-evident against the services' own credential adds, in .env:
#   RENKEI_RUNTIME_DB_USER / RENKEI_RUNTIME_DB_PASSWORD
#       the role every service but `migrate` connects as: DML on every table,
#       INSERT and SELECT only on the audit trails. Created and kept current
#       by `migrate`, which keeps connecting as the owner. Password: hex.
#   RENKEI_SANDBOX_DB_USER / RENKEI_SANDBOX_DB_PASSWORD
#       optional, a further role for worker-sandbox alone (the container that
#       runs other people's commands), limited to the tables it uses. Unset,
#       the sandbox uses the runtime role.
# With these unset every URL below resolves to the owner, so nothing changes.
# Set the user AND the password together; run `migrate` before restarting the
# services on them.
#   x-database-urls          the owner     — `migrate` only
#   x-runtime-database-urls  the runtime role (owner while unset)
#   x-sandbox-database-urls  the sandbox role (runtime role, else owner)
x-database-urls: &database-urls
  DATABASE_URL: postgres://${POSTGRES_USER:-renkei}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}@postgres:5432/${POSTGRES_DB:-renkei}${DATABASE_URL_PARAMS:-}
x-runtime-database-urls: &runtime-database-urls
  DATABASE_URL: postgres://${RENKEI_RUNTIME_DB_USER:-${POSTGRES_USER:-renkei}}:${RENKEI_RUNTIME_DB_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}}@postgres:5432/${POSTGRES_DB:-renkei}${DATABASE_URL_PARAMS:-}
x-sandbox-database-urls: &sandbox-database-urls
  DATABASE_URL: postgres://${RENKEI_SANDBOX_DB_USER:-${RENKEI_RUNTIME_DB_USER:-${POSTGRES_USER:-renkei}}}:${RENKEI_SANDBOX_DB_PASSWORD:-${RENKEI_RUNTIME_DB_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}}}@postgres:5432/${POSTGRES_DB:-renkei}${DATABASE_URL_PARAMS:-}
# What `migrate` reads to create the roles above; empty means "not asked for".
x-database-roles: &database-roles
  RENKEI_RUNTIME_DB_USER: ${RENKEI_RUNTIME_DB_USER:-}
  RENKEI_RUNTIME_DB_PASSWORD: ${RENKEI_RUNTIME_DB_PASSWORD:-}
  RENKEI_SANDBOX_DB_USER: ${RENKEI_SANDBOX_DB_USER:-}
  RENKEI_SANDBOX_DB_PASSWORD: ${RENKEI_SANDBOX_DB_PASSWORD:-}

# The delegate (docs/delegate-key-design.md) is where every other process
# gets a chat's key, a person's provider token and the connector workers;
# each caller reaches it at this address with ITS OWN bearer key, so a key
# that leaks from one container names which one, and is rotated alone:
#   DELEGATE_KEY_WEB, DELEGATE_KEY_WORKER, DELEGATE_KEY_AGENTS,
#   DELEGATE_KEY_SANDBOX   — each `openssl rand -base64 32`, all in .env
# The delegate takes all four as DELEGATE_WORKER_API_KEYS, which maps each
# caller name to its key and is what the delegate authorizes by; never hand
# it the same keys as a plain list, since a key named by the legacy single
# variable counts as the web caller. No shared DELEGATE_WORKER_API_KEY
# in .env is needed or read.
x-delegate-url: &delegate-url
  DELEGATE_WORKER_URL: http://renkei-worker-delegate:8096

# What every stateless service runs under. No capability at all (the Node
# processes bind ports above 1024 as an unprivileged user and need none),
# no way to gain one (no setuid binary in the image can escalate), and a
# root filesystem that cannot be written: the images hold code, not state,
# and a process that cannot rewrite its own dependencies is the better
# arrangement. Each service adds the tmpfs mounts for the few paths Node
# and Next do write (a temp dir, the runtime user's home, Next's
# .next/cache). Postgres and the sandbox worker are the two stateful
# exceptions and carry their own settings below.
x-locked-down: &locked-down
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
x-worker-tmpfs: &worker-tmpfs
  - /tmp
  - /home/worker
x-delegate-web: &delegate-web
  <<: *delegate-url
  DELEGATE_WORKER_API_KEY: ${DELEGATE_KEY_WEB:?set DELEGATE_KEY_WEB in .env (openssl rand -base64 32)}
x-delegate-worker: &delegate-worker
  <<: *delegate-url
  DELEGATE_WORKER_API_KEY: ${DELEGATE_KEY_WORKER:?set DELEGATE_KEY_WORKER in .env (openssl rand -base64 32)}
x-delegate-agents: &delegate-agents
  <<: *delegate-url
  DELEGATE_WORKER_API_KEY: ${DELEGATE_KEY_AGENTS:?set DELEGATE_KEY_AGENTS in .env (openssl rand -base64 32)}
x-delegate-sandbox: &delegate-sandbox
  <<: *delegate-url
  DELEGATE_WORKER_API_KEY: ${DELEGATE_KEY_SANDBOX:?set DELEGATE_KEY_SANDBOX in .env (openssl rand -base64 32)}

# What each service is handed from .env. There is NO `env_file: .env` on any
# service: a container gets exactly the variables below, so the per-caller
# delegate keys and the delegate-only USER_KEY_ENCRYPTION_KEY mean something
# at the container boundary — a process that is compromised holds its own
# bearer key and nothing that opens another caller's. A bare `NAME:` passes
# the value from .env through when it is set and leaves it unset otherwise,
# the same as it was under env_file.
#
# Encryption keys a service seals or opens organization-level values with
# (connector configs, model keys, content envelopes).
x-crypto-keys: &crypto-keys
  TOKEN_ENCRYPTION_KEY:
  TOKEN_ENCRYPTION_KEYS:
  CONTENT_ENCRYPTION_KEY:
  CONTENT_ENCRYPTION_KEYS:
# Log sealing and shipping, read by every long-running process.
x-logging-env: &logging-env
  LOG_ENCRYPTION_KEY:
  LOG_ENCRYPTION_KEYS:
  LOG_SHIP_ENDPOINT:
  LOG_SHIP_CLIENT_ID:
  LOG_SHIP_API_KEY:
  LOG_SHIP_SIGNING_KEYS:
# Chat attachments (the web app and the agents worker's retention sweep).
x-blob-store: &blob-store
  BLOB_STORE_PROVIDER:
  AZURE_BLOB_ACCOUNT:
  AZURE_BLOB_KEY:
  AZURE_BLOB_CONTAINER:
  AZURE_BLOB_ENDPOINT:

services:
  # Third-party images are pinned to a digest as well as a tag — the tag
  # says what it is, the digest says exactly which build, so a tag that is
  # re-pointed upstream changes nothing here until someone chooses it.
  # Dependabot proposes the new digest when the tag moves (docker-compose
  # ecosystem in .github/dependabot.yml). The scan of this image is the
  # operator's: CI scans only the images it builds.
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: renkei-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-renkei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (openssl rand -hex 32)}
      POSTGRES_DB: ${POSTGRES_DB:-renkei}
    volumes:
      - renkei-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-renkei} -d ${POSTGRES_DB:-renkei}']
      interval: 5s
      timeout: 5s
      retries: 10
    # The image's entrypoint starts as root and drops to postgres itself;
    # no-new-privileges does not stop that drop, only an escalation.
    security_opt:
      - no-new-privileges:true
    # Also on `renkei-sandbox-db`, which only worker-sandbox shares (see the
    # networks block): the sandbox worker is a database client.
    networks:
      - renkei-internal
      - renkei-sandbox-db
    restart: unless-stopped

  migrate:
    image: scotteremiaroden/renkei-migrate:latest
    container_name: renkei-migrate
    environment:
      <<: [*database-urls, *database-roles, *crypto-keys]
      # Two migrations reseal sandbox secrets.
      SANDBOX_ENV_SECRETS_KEY:
      SANDBOX_ENV_SECRETS_KEYS:
    <<: *locked-down
    tmpfs:
      - /tmp
    networks:
      - renkei-internal
    depends_on:
      postgres:
        condition: service_healthy
    # Kept out of `docker compose up` so starting the gateway never re-runs
    # migrations as a side effect. Run manually with:
    # docker compose -f docker-compose.yaml run --rm migrate
    profiles: ['tools']

  worker:
    image: scotteremiaroden/renkei-worker:latest
    container_name: renkei-worker
    # Optional e2e log shipping (worker → renkei over HTTP, encrypted +
    # signed, instead of writing the logs table directly). Generate the whole
    # .env block with:  pnpm --filter renkei generate:log-ship-keys (from a
    # checkout; in the image: docker compose run --rm --no-deps renkei
    # node scripts/generate-log-ship-keys.mjs)
    #   LOG_SHIP_ENDPOINT=http://renkei:3000/api/logs   (turns it on)
    #   LOG_SHIP_API_KEY / LOG_SHIP_SIGNING_KEYS        (auth + identity)
    # The renkei service reads LOG_SHIP_API_KEY and LOG_E2E_SERVER_KEYS from
    # the same .env. Unset, the worker logs straight to Postgres as before.
    #
    # Claims on the events queue are fair across sources (webex, microsoft,
    # zoom, ...), so one connector's storm can't starve another's replies.
    # To go further and dedicate a whole instance, set
    #   WORKER_EVENT_SOURCES: webex,zoom
    # here (and run a second worker service without it for the rest).
    #
    # Reaches the delegate for chat keys, provider tokens and the connector
    # workers (a person's own credential attached there, never here).
    environment:
      <<: [*crypto-keys, *logging-env, *runtime-database-urls, *delegate-worker]
    <<: *locked-down
    tmpfs: *worker-tmpfs
    networks:
      - renkei-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The embedding queue's consumer (Decision #20): same image as `worker`,
  # different entrypoint. All ingest-time calls to the org-configured
  # embeddings endpoint happen in this process, so however slow that
  # endpoint is, the interactive worker above never waits on it. Safe to
  # scale to N instances (drop container_name and use --scale): claims are
  # row-locked, and ordering keys keep each mailbox's/object's job sequence
  # serial regardless of instance count.
  embeddings-worker:
    image: scotteremiaroden/renkei-worker:latest
    container_name: renkei-embeddings-worker
    command: ['node', 'node_modules/tsx/dist/cli.mjs', 'src/embeddings-worker.ts']
    environment:
      <<: [*crypto-keys, *logging-env, *runtime-database-urls, *delegate-worker]
    <<: *locked-down
    tmpfs: *worker-tmpfs
    networks:
      - renkei-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The agents worker (user-drafted agent runs): same image as `worker`,
  # different entrypoint — the embeddings pattern. No container_name on
  # purpose: scale with `--scale worker-agents=N` — row-locked claims,
  # per-agent ordering keys, and optimistic sweeps make replicas safe.
  worker-agents:
    image: scotteremiaroden/renkei-worker:latest
    # The agents worker is the other app on the worker image; its own directory
    # is the working directory, as the image's default command has for apps/worker.
    working_dir: /app/apps/worker-agents
    command: ['node', 'node_modules/tsx/dist/cli.mjs', 'src/index.ts']
    environment:
      <<: [*crypto-keys, *logging-env, *blob-store, *runtime-database-urls, *delegate-agents]
      RENKEI_WEB_INTERNAL_URL: http://renkei-app:3000
    <<: *locked-down
    tmpfs: *worker-tmpfs
    networks:
      - renkei-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # On SIGTERM the engine hands the run in flight back to the queue at
    # its next checkpoint (a step, a model call, a tool call) — a model
    # call can take most of a minute to reach one. Docker's default 10s
    # would kill it first and leave the job to its 30-minute lease.
    stop_grace_period: 45s

  # The batch-jobs worker (document-ocr-pipeline and future batch kinds):
  # same image as `worker`, different entrypoint — the embeddings pattern.
  # Its own queue (batch_job_messages) because item work — an OCR call per
  # document — is slow, external, per-item I/O that must never sit in
  # front of the interactive worker's webhook replies. No container_name
  # on purpose: scale with `--scale worker-batch-jobs=N`, same reasoning as
  # worker-agents. Reads source documents from a file share through the
  # delegate (the person's own share credential is attached there) and
  # stages OCR results on the sandbox worker directly, over the same
  # internal URL the web app uses, with the same bearer key from .env.
  worker-batch-jobs:
    image: scotteremiaroden/renkei-worker:latest
    command: ['node', 'node_modules/tsx/dist/cli.mjs', 'src/batch-jobs-worker.ts']
    environment:
      <<: [*crypto-keys, *logging-env, *runtime-database-urls, *delegate-worker]
      SANDBOX_WORKER_API_KEY:
      SANDBOX_WORKER_URL: ${SANDBOX_WORKER_URL:-http://renkei-worker-sandbox:8092}
    <<: *locked-down
    tmpfs: *worker-tmpfs
    # On the sandbox network too, as a CALLER of the sandbox worker (OCR
    # results are staged there). It listens on nothing, so the sandbox
    # gains no route into it by sharing the network.
    networks:
      - renkei-internal
      - renkei-sandbox
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The file-share I/O worker: the only process that opens SMB/SFTP
  # sessions or decrypts share credentials. Its own image (not the shared
  # worker one), so the SMB/SSH protocol stack ships apart from the queue
  # workers and this service rolls out independently. The delegate reaches
  # it over HTTP on the compose network (FILESHARES_WORKER_URL on
  # worker-delegate below) with the shared FILESHARES_WORKER_API_KEY from
  # .env — generate one with `openssl rand -base64 32`. No published ports
  # on purpose: nothing outside the compose network may speak to it.
  worker-fileshares:
    image: scotteremiaroden/renkei-fileshares:latest
    container_name: renkei-worker-fileshares
    command: ['node', 'node_modules/tsx/dist/cli.mjs', 'src/index.ts']
    environment:
      <<: [*runtime-database-urls, *crypto-keys, *logging-env]
      FILESHARES_WORKER_API_KEY:
    <<: *locked-down
    tmpfs: *worker-tmpfs
    networks:
      - renkei-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The OnBase egress worker: the only process that dials a customer's
  # on-prem OnBase API Server or Hyland IdP. Its own image so it rolls out
  # independently of the queue workers. The delegate reaches it over HTTP
  # on the compose network (ONBASE_WORKER_URL on worker-delegate below)
  # with the shared ONBASE_WORKER_API_KEY from .env — generate one with
  # `openssl rand -base64 32`. No published ports on purpose: nothing
  # outside the compose network may speak to it.
  worker-onbase:
    image: scotteremiaroden/renkei-onbase:latest
    container_name: renkei-worker-onbase
    command: ['node', 'node_modules/tsx/dist/cli.mjs', 'src/index.ts']
    environment:
      <<: [*runtime-database-urls, *crypto-keys, *logging-env]
      ONBASE_WORKER_API_KEY:
    <<: *locked-down
    tmpfs: *worker-tmpfs
    networks:
      - renkei-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The Mirth Connect egress worker: the only process that dials an
  # organization's Mirth Connect servers (dev, test, prod…) or decrypts a
  # person's stored Mirth credential. Its own image so it rolls out
  # independently of the queue workers. The delegate reaches it over HTTP
  # on the compose network (MIRTH_WORKER_URL on worker-delegate below)
  # with the shared MIRTH_WORKER_API_KEY from .env — generate one with
  # `openssl rand -base64 32`. No published ports on purpose: nothing
  # outside the compose network may speak to it.
  worker-mirth:
    image: scotteremiaroden/renkei-mirth:latest
    container_name: renkei-worker-mirth
    command: ['node', 'node_modules/tsx/dist/cli.mjs', 'src/index.ts']
    environment:
      <<: [*runtime-database-urls, *crypto-keys, *logging-env]
      MIRTH_WORKER_API_KEY:
    <<: *locked-down
    tmpfs: *worker-tmpfs
    networks:
      - renkei-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The ADManager Plus egress worker: the only process that dials an
  # organization's ManageEngine ADManager Plus servers or decrypts a
  # person's stored authtoken. Its own image so it rolls out independently
  # of the queue workers. The delegate reaches it over HTTP on the compose
  # network (ADMANAGER_WORKER_URL on worker-delegate below) with the shared
  # ADMANAGER_WORKER_API_KEY from .env — generate one with
  # `openssl rand -base64 32`. No published ports on purpose: nothing
  # outside the compose network may speak to it.
  worker-admanager:
    image: scotteremiaroden/renkei-admanager:latest
    container_name: renkei-worker-admanager
    command: ['node', 'node_modules/tsx/dist/cli.mjs', 'src/index.ts']
    environment:
      <<: [*runtime-database-urls, *crypto-keys, *logging-env]
      ADMANAGER_WORKER_API_KEY:
    <<: *locked-down
    tmpfs: *worker-tmpfs
    networks:
      - renkei-internal
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The delegate — the one process that holds a key
  # (docs/delegate-key-design.md). It derives nothing: a signed-in browser
  # seals its person's key to this instance's public key, and the delegate
  # opens that to unwrap a chat's or project's data key and a person's
  # sealed values, on behalf of the app and the other workers, which reach
  # it at DELEGATE_WORKER_URL with their own bearer keys (the x-delegate-*
  # blocks at the top) and hold no key themselves. It also holds every
  # provider token, forwards Mirth, ADManager Plus, file-share and OnBase
  # operations to their workers with the person's credential attached, and
  # relays a code workspace's git for the sandbox worker (/git/<ticket>/…).
  # TOKEN_ENCRYPTION_KEY (the connector configs a refresh needs) comes from
  # .env. USER_KEY_ENCRYPTION_KEY is migration-only: set it in .env while
  # people from before held keys have not enrolled, drop it after. Without
  # this service no chat opens and no connector acts: fail closed. No
  # published ports on purpose: nothing outside the compose network may
  # speak to it.
  worker-delegate:
    image: scotteremiaroden/renkei-delegate:latest
    container_name: renkei-worker-delegate
    command: ['node', 'node_modules/tsx/dist/cli.mjs', 'src/index.ts']
    environment:
      <<: [*runtime-database-urls, *crypto-keys, *logging-env]
      # One key per caller (see the top of this file). The map is what the
      # delegate reads; the plain list is the same four keys for a delegate
      # image from before the map existed, so either reads them.
      DELEGATE_WORKER_API_KEYS: web=${DELEGATE_KEY_WEB:?set DELEGATE_KEY_WEB in .env (openssl rand -base64 32)},worker=${DELEGATE_KEY_WORKER:?set DELEGATE_KEY_WORKER in .env (openssl rand -base64 32)},agents=${DELEGATE_KEY_AGENTS:?set DELEGATE_KEY_AGENTS in .env (openssl rand -base64 32)},sandbox=${DELEGATE_KEY_SANDBOX:?set DELEGATE_KEY_SANDBOX in .env (openssl rand -base64 32)}
      USER_KEY_ENCRYPTION_KEY: ${USER_KEY_ENCRYPTION_KEY:-}
      # The connector workers the delegate forwards to, with the person's
      # credential attached (forward/<connector>/<op>); the bearer keys
      # (*_WORKER_API_KEY) come from .env.
      FILESHARES_WORKER_API_KEY:
      ONBASE_WORKER_API_KEY:
      MIRTH_WORKER_API_KEY:
      ADMANAGER_WORKER_API_KEY:
      FILESHARES_WORKER_URL: http://renkei-worker-fileshares:8090
      ONBASE_WORKER_URL: http://renkei-worker-onbase:8091
      MIRTH_WORKER_URL: http://renkei-worker-mirth:8093
      ADMANAGER_WORKER_URL: http://renkei-worker-admanager:8095
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:8096/health', (r) => { if (r.statusCode !== 200) throw new Error(r.statusCode) })",
        ]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    <<: *locked-down
    tmpfs: *worker-tmpfs
    # This process holds unwrapped keys and provider tokens in memory; a
    # crash must not write them to a core file on the host.
    ulimits:
      core: 0
    # On both networks: the sandbox worker's git reaches the /git/<ticket>
    # proxy here, and nothing else of the sandbox's.
    networks:
      - renkei-internal
      - renkei-sandbox
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The agent scratch-space worker: the only process that writes staged
  # file bytes to disk (see docs/sandbox-connector-design.md — this is the
  # first place Renkei deliberately holds bytes at rest outside a provider
  # or a browser). Its own image and its own volume, same isolation as the
  # fileshares/onbase workers below. The web app reaches it over HTTP on
  # the compose network (SANDBOX_WORKER_URL below) with the shared
  # SANDBOX_WORKER_API_KEY from .env — generate one with
  # `openssl rand -base64 32`. No published ports on purpose: nothing
  # outside the compose network may speak to it.
  #
  # Which of the worker's features an organization gets — the browser,
  # charts, code workspaces, services, scripts — is that organization's
  # own setting (admin → Settings → Sandbox, migration 152), read by the
  # web app and this worker per request; nothing in .env switches one on.
  # What the worker CAN do it finds at boot and reports on /health.
  #
  # It carries the headless browser behind the sandbox_browser_* tools
  # (a headless Chromium baked into the image), launched lazily on an
  # organization's first page. The browser's every connection goes
  # through an in-process egress proxy that refuses private and internal
  # addresses, so it cannot reach the other compose services either.
  # Charts from Mermaid text are drawn in that same Chromium, behind
  # sandbox_render_chart and the chat's chat_write_chart; a chart page has
  # no network at all.
  #
  # Code projects: a Bitbucket repository cloned onto the second volume below,
  # where the project's chats can read, edit, run the project's own
  # commands, commit and push (docs/sandbox-workspaces-design.md). The
  # container then runs its supervisor as root so every caller's commands
  # can be dropped to that caller's own uid (docker/sandbox-entrypoint.sh).
  # Those commands DO have this container's network — a project's own
  # install and tests need the internet — which is why this service is kept
  # off `renkei-internal` and on `renkei-sandbox` (a route out, and of the stack only the web app,
  # the delegate's git proxy and the batch worker, which join that network
  # to be reached or to call this service) and on `renkei-sandbox-db`,
  # which it shares with postgres and nothing else. THE SANDBOX CONTAINER
  # THEREFORE HAS A ROUTE TO POSTGRES, and so does every command a
  # workspace runs, since commands have the container's network: the worker
  # is a database client (staged files, settings, crawls, its log). What
  # holds that route in check is the role it connects as: with
  # RENKEI_SANDBOX_DB_USER set (see the top of this file) it can touch only
  # the sandbox tables and the logs, never chats, agents, keys or grants;
  # without it the worker uses the runtime role (or the owner), and the
  # route is to the whole database. The bearer keys and database password
  # are never in a command's environment; the route is only the network's.
  # The other workers stay off both networks. SANDBOX_ENV_SECRETS_KEY in .env
  # (`openssl rand -base64 32`) seals the environment variables people hand
  # their commands; it falls back to TOKEN_ENCRYPTION_KEY.
  #
  # Scripts (sandbox_run_python in every chat with a scratch space, for an
  # organization that has turned them on): Python the
  # model wrote, run over COPIES of the person's own staged files in a
  # throwaway directory under /runs (no volume), as that person's own uid
  # — the container runs its supervisor as root for the same reason as
  # workspaces, with or without them — and, unlike a workspace command,
  # with NO network: a script's own network namespace (unshare --net).
  # That namespace needs CAP_SYS_ADMIN, which this service deliberately
  # does not have (cap_drop below) — SYS_ADMIN is most of root, and would
  # sit in the same container as every caller's checkout — and Docker's
  # default seccomp profile blocks the user-namespace fallback, so on a
  # stock deployment the worker proves at boot that it cannot isolate a
  # script and CLOSES the verb (503 scripts_unavailable; the web app stops
  # offering the tool) rather than run it on the container's network. The
  # supported way to open it WITHOUT SYS_ADMIN is user-namespace isolation
  # on the host (`"userns-remap": "default"` in /etc/docker/daemon.json,
  # see DEPLOYMENT.md, "Scripts over staged files"), under which this
  # container's root is an unprivileged host uid and the kernel lets it
  # create its own namespaces. An organization's "Allow scripts on the
  # worker's network" setting instead accepts scripts on the container's
  # network for that organization, with the tool's description and every
  # result saying so.
  # The organization's "Script memory" setting (admin → Settings → Sandbox,
  # default 2 GB) caps a run's address space; several people running large
  # joins at once share SANDBOX_WORKER_MEMORY below with the browser, so
  # raise it with that setting.
  #
  # STATEFUL, unlike the queue workers above: checkouts on /workspaces and
  # staged bytes on /data, with only the rows in the database. Replicas
  # (drop container_name, `scale: N`) work on one host BECAUSE they share
  # the two named volumes below — the worker keeps nothing about either in
  # memory and reads the disk on every call. Mount both, always: with
  # only /data mounted, each replica keeps checkouts in its own writable
  # layer, and a clone on one replica is "gone" on the next (Docker's DNS
  # has no session affinity). Browser sessions and unlocked secret keys
  # are live process state and stay per replica; run one replica if the
  # sandbox_browser_* tools matter. DEPLOYMENT.md, "More than one sandbox
  # replica".
  worker-sandbox:
    image: scotteremiaroden/renkei-sandbox:latest
    container_name: renkei-worker-sandbox
    command: ['node', 'node_modules/tsx/dist/cli.mjs', 'src/index.ts']
    # Its own secrets only (see x-crypto-keys): the sandbox runs untrusted
    # code and a headless browser, so it is NOT handed TOKEN_ENCRYPTION_KEY
    # or CONTENT_ENCRYPTION_KEY. Workspace and browser secrets are sealed
    # under SANDBOX_ENV_SECRETS_KEY, which therefore must be set in .env
    # (the worker's fallback to TOKEN_ENCRYPTION_KEY has nothing to fall
    # back to here).
    environment:
      <<: [*sandbox-database-urls, *delegate-sandbox, *logging-env]
      SANDBOX_WORKER_API_KEY:
      SANDBOX_ENV_SECRETS_KEY:
      SANDBOX_ENV_SECRETS_KEYS:
      SANDBOX_DOCKER_HOST:
      SANDBOX_SERVICES_NETWORK:
      # A fixed Node heap, well inside the container limit, so the worker's
      # own process can never be what pushes the container over it — the
      # browser gets the rest.
      NODE_OPTIONS: --max-old-space-size=1024
      # This container's own name, for joining the services network when
      # code project services are on (the socket below).
      SANDBOX_CONTAINER_ID: renkei-worker-sandbox
    volumes:
      - renkei-sandbox-data:/data
      - renkei-sandbox-workspaces:/workspaces
      # Code project services (an organization's own setting): the worker
      # starts containers —
      # Postgres, Redis — beside a project's checkout, from the images the
      # organization allows, through the host's Docker engine. Uncomment
      # the socket to turn that on. It is root's inside the container
      # (a project's own commands, dropped to their own uids, cannot open
      # it), but it is the engine, so it is this worker's process that is
      # trusted with it: prefer a socket proxy (docker-socket-proxy with
      # CONTAINERS, IMAGES, NETWORKS and POST allowed, nothing else) and
      # SANDBOX_DOCKER_HOST=tcp://proxy:2375 instead of the raw socket
      # where that is available. Services are created on the internal
      # network SANDBOX_SERVICES_NETWORK (default renkei-sandbox-services),
      # which this container joins at boot; SANDBOX_CONTAINER_ID names
      # this container for that join (the hostname works when compose is
      # left to set it).
      # - /var/run/docker.sock:/var/run/docker.sock
    # The browser is the memory hog in this stack: a busy session runs
    # 300-500MB, up to eight at once. The reservation asks the host to keep
    # that much for it; the limit stops a runaway page from taking the box
    # down instead; the negative OOM score means the kernel kills something
    # else first when memory does run short (a killed browser drops every
    # agent's session). /dev/shm is where Chromium shares frames between
    # its processes; Docker's 64MB default is what "page crashed" on a
    # heavy site usually means. Raise SANDBOX_WORKER_MEMORY in .env for a
    # deployment that drives many browser sessions at once.
    mem_reservation: 1g
    mem_limit: ${SANDBOX_WORKER_MEMORY:-4g}
    shm_size: 1g
    oom_score_adj: -500
    # Root inside, but with exactly the capabilities the entrypoint and
    # workspaces.ts use and nothing else: SETUID/SETGID/SETPCAP for setpriv
    # to drop each caller's command to its own uid and clear its bounding
    # set, CHOWN/FOWNER/DAC_OVERRIDE to make a caller's 0700 checkout and
    # home theirs and to read the files they leave there, KILL to signal
    # the process groups those commands run in. No SYS_ADMIN (above), no
    # NET_*, no MKNOD, no SYS_PTRACE. no-new-privileges holds here too:
    # setpriv's drop is a loss of privilege, which the flag permits, and it
    # is what the flag denies — a setuid binary in a checkout regaining
    # root — that matters most in this container.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
      - SETPCAP
    networks:
      - renkei-sandbox
      - renkei-sandbox-db
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # On SIGTERM the worker turns new requests away, kills the commands
    # in flight so their callers get an "interrupted" answer rather than
    # a dropped socket, and closes the browser. Longer than the worker's
    # own 25s deadline (src/index.ts), so it is the worker that decides.
    stop_grace_period: 30s

  renkei:
    image: scotteremiaroden/renkei:latest
    container_name: renkei-app
    environment:
      # The connector workers (file shares, OnBase, Mirth, ADManager Plus)
      # are reached through the delegate, which attaches the person's
      # credential; the app holds neither their addresses nor their keys.
      <<: [*runtime-database-urls, *delegate-web, *crypto-keys, *logging-env, *blob-store]
      SETUP_SECRET:
      # Required: the https address people reach this app at. Registered with
      # the identity provider and every connector; the app refuses to start
      # without it rather than read an origin off request headers.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env (the https address people reach this app at)}
      BITBUCKET_API_BASE_URL:
      ENTRA_DEVELOPER_API_BASE_URL:
      GITHUB_API_BASE_URL:
      JIRA_ADMIN_API_BASE_URL:
      JIRA_AUTOMATION_API_BASE_URL:
      SANDBOX_WORKER_API_KEY:
      # Where the web app reaches the sandbox worker; the bearer key
      # (SANDBOX_WORKER_API_KEY) comes from the shared .env. Omit both to
      # run without an agent scratch space — the sandbox_* tools simply
      # don't register. Which of the worker's features an organization gets
      # (the sandbox_browser_* tools, charts, the Code section and its
      # code_* and code_service_* tools, sandbox_run_python) is that
      # organization's own setting under admin → Settings → Sandbox, read
      # per request here and on the worker.
      SANDBOX_WORKER_URL: ${SANDBOX_WORKER_URL:-http://renkei-worker-sandbox:8092}
      # The chat calls the app's OWN MCP endpoint for tool calls, the same
      # way the agents worker does; loopback inside the container.
      RENKEI_WEB_INTERNAL_URL: http://127.0.0.1:3000
      # Chat attachments live in Azure Blob Storage: BLOB_STORE_PROVIDER=azure
      # plus AZURE_BLOB_ACCOUNT / AZURE_BLOB_KEY / AZURE_BLOB_CONTAINER (and
      # AZURE_BLOB_ENDPOINT for a non-default endpoint) come from .env, read
      # by this service AND worker-agents (whose retention sweep deletes
      # blobs). Unset, chat uploads are simply off.
    # Published on this host's loopback only: put a TLS-terminating reverse
    # proxy in front (it forwards to 127.0.0.1:3000). Sign-in cookies are
    # `Secure`, so plain HTTP from other machines cannot sign in anyway, and
    # bearer tokens must not cross a network in the clear.
    ports:
      - '127.0.0.1:3000:3000'
    <<: *locked-down
    tmpfs:
      - /tmp
      - /home/nextjs
      # Next's runtime cache (image optimizer output, fetch cache); the
      # only place under /app the app writes.
      - /app/apps/web/.next/cache
    # On both networks: the sandbox worker is reached from here
    # (SANDBOX_WORKER_URL), and a workspace's commands may call this app's
    # own MCP endpoint.
    networks:
      - renkei-internal
      - renkei-sandbox
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # On SIGTERM every chat turn running in the process suspends itself
    # (its row marked for another process's recovery sweep — this one's,
    # after the restart) and the open event streams close, so Next can
    # drain and exit inside this. Docker's default 10s cut it close.
    stop_grace_period: 30s

# Three networks. The one container that runs other people's code
# (worker-sandbox) is on two of them: `renkei-sandbox`, shared with the web
# app, the delegate and the batch worker (which call it or are called by
# it), and `renkei-sandbox-db`, shared with postgres ONLY. That second one
# exists because the sandbox worker is a Postgres client (audit R-06); it
# is internal (no route out of the host through it) and nothing else joins
# it, so the sandbox has a route to the database and to no other worker.
# Every other service lives on `renkei-internal`, which the sandbox is not
# on. `renkei-internal` and `renkei-sandbox` have a route out of the host
# (a workspace's install and tests, and the connectors' provider APIs, need
# the internet); none publishes anything. A service another operator adds
# goes on `renkei-internal` unless the sandbox must reach it.
# scripts/check-compose-secrets.mjs asserts this layout.
networks:
  renkei-internal:
    name: renkei-internal
  renkei-sandbox:
    name: renkei-sandbox
  renkei-sandbox-db:
    name: renkei-sandbox-db
    internal: true

volumes:
  renkei-postgres:
  renkei-sandbox-data:
  renkei-sandbox-workspaces:
