<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone: commit sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#ffffff;color:#111827}
a{color:#2563eb}a:hover{color:#1d4ed8}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #ffffff; font-size: 14px; overflow: hidden;">
  <!-- The code tab underneath -->
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; opacity: .5;">
    <div style="height: 56px; border-bottom: 1px solid #e5e7eb;"></div>
    <div style="height: 48px; border-bottom: 1px solid #e5e7eb;"></div>
    <div class="mono" style="padding: 14px; font-size: 13px; color: #9ca3af; line-height: 22px;">lib/code/turn.ts<br>lib/code/turn.test.ts<br>docs/chat.md</div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(17, 24, 39, .4);"></div>

  <!-- Bottom sheet -->
  <div role="dialog" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffffff; border-radius: 16px 16px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.2); display: flex; flex-direction: column; max-height: 720px;">
    <div style="display: flex; justify-content: center; padding: 8px 0 0;"><span style="width: 36px; height: 4px; border-radius: 2px; background: #d1d5db;"></span></div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 16px 12px;">
      <h2 id="sheet-title" style="margin: 0; font-size: 16px; font-weight: 600; flex-grow: 1;">Commit changes</h2>
      <span class="mono" style="font-size: 12px; color: #6b7280; display: flex; align-items: center; gap: 5px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="8" r="2.5"/><path d="M6 8.5v7M18 10.5c0 4-12 2-12 5"/></svg>claude/env-masking</span>
    </div>

    <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">
      <div style="border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden;">
        <label style="display: flex; align-items: center; gap: 12px; padding: 0 12px; min-height: 48px; border-bottom: 1px solid #e5e7eb; font-size: 13px;"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0;"><span class="mono" style="flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">lib/code/turn.ts</span><span class="mono" style="font-size: 12px;"><span style="color: #16a34a;">+9</span> <span style="color: #dc2626;">−2</span></span></label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 0 12px; min-height: 48px; border-bottom: 1px solid #e5e7eb; font-size: 13px;"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0;"><span class="mono" style="flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">lib/code/turn.test.ts</span><span class="mono" style="font-size: 12px;"><span style="color: #16a34a;">+31</span></span></label>
        <label style="display: flex; align-items: center; gap: 12px; padding: 0 12px; min-height: 48px; font-size: 13px;"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0;"><span class="mono" style="flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">docs/chat.md</span><span class="mono" style="font-size: 12px;"><span style="color: #16a34a;">+2</span> <span style="color: #dc2626;">−1</span></span></label>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <label for="sheet-subject" style="font-size: 12px; color: #6b7280;">Message</label>
        <input id="sheet-subject" type="text" value="Mask env values in code_run output before rendering" style="box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; color: #111827;">
        <textarea id="sheet-body" aria-label="Description" rows="3" style="box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; color: #111827; resize: none;">The worker masked values in the command's environment but not in its output.</textarea>
        <a href="#suggest" style="font-size: 12px; text-decoration: none;">Suggest a message from the diff</a>
      </div>

      <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #374151; min-height: 44px;"><input type="checkbox" style="width: 18px; height: 18px; margin: 0;">Create a new branch first</label>
    </div>

    <div style="padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 8px;">
      <button type="button" style="height: 48px; border: 1px solid #2563eb; border-radius: 10px; background: #2563eb; color: #ffffff; font-size: 15px; font-weight: 500;">Commit 3 files</button>
      <span style="font-size: 12px; color: #6b7280; text-align: center;">Authored as Alex Rivera · push afterwards, or ask the chat to open a pull request</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
