packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
catalog:
  # pdfjs is imported dynamically, by bare specifier, from
  # packages/document-text/src/pdf.ts. Next.js compiles that file INTO the web
  # bundle (transpilePackages), so at runtime Node resolves the specifier from
  # apps/web/.next/server — which never sees packages/document-text's own
  # node_modules. Every app that extracts document text therefore has to
  # declare pdfjs itself, and a catalog entry is what keeps those declarations
  # from drifting apart: one exact pin, so `pnpm audit` has a single version to
  # talk about and no app can silently resolve a different one.
  pdfjs-dist: 6.4.299
# A release has to be a day old before pnpm will resolve to it: the window
# in which a hijacked package's malicious version is usually noticed and
# pulled. Exact pins already in the lockfile are unaffected; this governs
# what an update may move to. The exclusion below is the repository's own
# library, published and consumed in the same sitting.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@campfhir/safe-functions@0.1.3'
# The CI gate is `pnpm audit --prod --audit-level=high` (the `security` job
# in .github/workflows/ci.yml): a NEW high or critical advisory against a
# production dependency fails the build. The advisories below were already
# open when the gate went in and are not fixable without a dependency bump
# that is its own change; each is listed with what fixes it and a review
# date. An entry past its date is overdue, not permanent: fix the
# dependency and delete the line, or renew the date with a reason. The same
# baseline, by CVE id, is in .trivyignore for the image scan. Keep the two
# in step.
auditConfig:
  ignoreGhsas: []
patchedDependencies:
  '@tryjsky/v9u-smb2': patches/@tryjsky__v9u-smb2.patch
# next 16.3.8 still pins postcss 8.4.31, whose own pins of nanoid and
# source-map-js carry fixable HIGH advisories; both patched versions sit
# inside postcss's own ranges (^3.3.6, ^1.0.2), so the override changes
# nothing postcss depends on. Drop these once next moves its postcss pin.
overrides:
  'nanoid@<3.3.18': '3.3.20'
  'source-map-js@<1.2.2': '1.2.2'
  # brace-expansion 2.x under exceljs → archiver and safe-functions →
  # minimatch, and lodash-es under mermaid → chevrotain: both patched
  # versions stay in the same major, so the override is a safe lift until
  # the dependents move their own pins.
  'brace-expansion@>=2.0.0 <2.1.7': '2.1.7'
  'lodash-es@<4.18.0': '4.18.0'
  # dompurify under monaco-editor (pinned exactly by monaco, one patch
  # behind the advisories' fixed version) and mermaid: patch releases of
  # the same minor, API-compatible.
  'dompurify@<3.4.16': '3.4.16'
  # uuid 8 under exceljs and 10 under pptx-preview: both call v4() only,
  # which 11 exports the same way for require and import. mermaid's own
  # range (`^11.1.0 || … || ^14`) admits 11.1.1 as well, which is what it
  # now shares.
  'uuid@<11.1.0': '11.1.1'
  # echarts 5 under pptx-preview (XSS fixed in 6.1.0): the previewer uses
  # init/setOption/dispose, unchanged across the major; verified by the
  # artifact-inline spec's PPTX preview.
  'echarts@<6.1.0': '6.1.0'
  # katex 0.16 under mermaid (prototype-pollution bypass fixed in 0.18.2):
  # mermaid calls renderToString, unchanged.
  'katex@<0.18.2': '0.18.2'
  # image-size 1.2 under pptxgenjs: declared but never called (the sizing
  # helper that used it is commented out in pptxgenjs 4.0.1), so the lift
  # to 2.x changes nothing at run time and retires the audit baseline.
  'image-size@<2.0.4': '2.0.4'
