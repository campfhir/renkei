services:
  postgres:
    # Matches docker-compose.yaml (the deploy stack). Postgres majors are not
    # binary compatible, so a dev/prod split here means testing migrations on a
    # different engine than they run on.
    image: postgres:16-alpine
    container_name: renkei-postgres
    environment:
      POSTGRES_USER: renkei
      POSTGRES_PASSWORD: renkei
      POSTGRES_DB: renkei
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renkei"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: renkei:latest
    container_name: renkei-app
    env_file:
      - .env.development
    environment:
      DATABASE_URL: postgres://renkei:renkei@postgres:5432/renkei
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      MIGRATIONS_DIR: dist/lib/migrations
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node dist/migrate.cjs && pnpm start"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
