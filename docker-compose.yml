services:
  postgres:
    # Matches docker-compose.yaml (the deploy stack). Postgres majors are not
    # binary compatible, so a dev/prod split here means testing migrations on a
    # different engine than they run on.
    image: pgvector/pgvector:pg16
    container_name: renkei-postgres
    environment:
      POSTGRES_USER: renkei
      POSTGRES_PASSWORD: renkei
      POSTGRES_DB: renkei
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renkei"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: renkei:latest
    container_name: renkei-app
    env_file:
      - apps/web/.env.development
    environment:
      DATABASE_URL: postgres://renkei:renkei@postgres:5432/renkei
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      FILESHARES_WORKER_URL: http://renkei-worker-fileshares:8090
      FILESHARES_WORKER_API_KEY: ${FILESHARES_WORKER_API_KEY:-renkei-dev-fileshares-key}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    image: renkei-worker:latest
    container_name: renkei-worker
    environment:
      DATABASE_URL: postgres://renkei:renkei@postgres:5432/renkei
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The embedding queue's consumer (Decision #20): same image as `worker`,
  # different entrypoint. All ingest-time calls to the org-configured
  # embeddings endpoint happen in this process, so however slow that
  # endpoint is, the interactive worker above never waits on it. Safe to
  # scale to N instances: row-locked claims plus ordering keys.
  embeddings-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    image: renkei-worker:latest
    container_name: renkei-embeddings-worker
    command: ['pnpm', '--filter', '@renkei/worker', 'start:embeddings']
    environment:
      DATABASE_URL: postgres://renkei:renkei@postgres:5432/renkei
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The agents worker (user-drafted agent runs — LLM loops with tool calls
  # against the app's own MCP endpoint): same image as `worker`, different
  # entrypoint — the embeddings pattern — so a slow model can never sit in
  # front of a webhook reply or an embedding job. Deliberately no
  # container_name: scale with `docker compose up -d --scale worker-agents=N`
  # — claims are row-locked, ordering key agent:{agentId} keeps one agent's
  # runs serial across replicas, and every sweep it hosts is
  # optimistic/idempotent.
  worker-agents:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    image: renkei-worker:latest
    command: ['pnpm', '--filter', '@renkei/worker-agents', 'start']
    environment:
      DATABASE_URL: postgres://renkei:renkei@postgres:5432/renkei
      RENKEI_WEB_INTERNAL_URL: http://app:3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The file-share I/O service — its own image (target `fileshares`), the
  # only container holding the SMB/SFTP stack or decrypting share
  # credentials. The app reaches it via FILESHARES_WORKER_URL with the
  # shared bearer key; the dev default below keeps the stack turnkey —
  # export FILESHARES_WORKER_API_KEY to override both sides at once.
  worker-fileshares:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: fileshares
    image: renkei-fileshares:latest
    container_name: renkei-worker-fileshares
    # TOKEN_ENCRYPTION_KEY must match the app's — it opens the stored share
    # credentials — so both read the same env file.
    env_file:
      - apps/web/.env.development
    environment:
      DATABASE_URL: postgres://renkei:renkei@postgres:5432/renkei
      FILESHARES_WORKER_API_KEY: ${FILESHARES_WORKER_API_KEY:-renkei-dev-fileshares-key}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: migrate
    image: renkei-migrate:latest
    container_name: renkei-dev-migrate
    environment:
      DATABASE_URL: postgres://renkei:renkei@postgres:5432/renkei
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
