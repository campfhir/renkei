version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: renkei-postgres
    environment:
      POSTGRES_USER: renkei
      POSTGRES_PASSWORD: renkei
      POSTGRES_DB: renkei
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renkei"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: renkei:latest
    container_name: renkei-app
    environment:
      DATABASE_URL: postgres://renkei:renkei@postgres:5432/renkei
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "node -r tsx scripts/migrate.ts && npm start"

volumes:
  postgres_data:
