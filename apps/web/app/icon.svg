<!--
  The browser-tab icon. Next picks this up by file convention (app/icon.svg)
  and emits the <link rel="icon"> itself — there is no `icons` entry in the
  metadata object, and adding one would compete with this file.

  Same mark and gradient as public/icon.svg, in a SQUARE viewBox. That file
  is 400x200, and a 2:1 canvas in a 16px square tab letterboxes to a mark
  half the height it could be. The path is untouched; only the frame moved:
  the stroked mark spans x 89-311, y 29-171, so a 240-unit box centred on
  (200, 100) holds it with a little air either side.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="80 -20 240 240"
  width="240"
  height="240"
  role="img"
  aria-label="Renkei"
>
  <defs>
    <linearGradient id="inf" x1="0" y1="0.15" x2="1" y2="0.85">
      <stop offset="0" stop-color="#5FE8E0"></stop>
      <stop offset="0.5" stop-color="#2FC8F0"></stop>
      <stop offset="1" stop-color="#2C7BE5"></stop>
    </linearGradient>
  </defs>
  <path
    d="M100 100C100 40 160 40 200 100C240 160 300 160 300 100C300 40 240 40 200 100C160 160 100 160 100 100Z"
    fill="none"
    stroke="url(#inf)"
    stroke-width="22"
    stroke-linecap="round"
  ></path>
</svg>
